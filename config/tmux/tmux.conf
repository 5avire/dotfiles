# ── Prefix ─────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space


# ── General ────────────────────────────────────────────────────
set -g base-index 1
set -g renumber-windows on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g detach-on-destroy off


# ── Vim / Copy Mode ────────────────────────────────────────────
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "wl-copy"

unbind -T copy-mode-vi MouseDragEnd1Pane

set -g set-clipboard on
set -g mouse on
set -g status-interval 1


# ── Reload ─────────────────────────────────────────────────────
unbind r
bind r source-file ~/.config/tmux/tmux.conf \;\
    display-popup -w 32 -h 3 -E \
    "printf '\\n  ✓  tmux reloaded\\n'; sleep 1"


# ── Session Picker ────────────────────────────────────────────
unbind f
bind-key f display-popup -E "zsh -ic 'ts'"


# ── Splits ─────────────────────────────────────────────────────
unbind %
unbind '"'

bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"


# ── Resize ────────────────────────────────────────────────────
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r l resize-pane -R 2
bind -r h resize-pane -L 2
bind -r m resize-pane -Z


# ── Plugins ────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'


# ── Resurrect ─────────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'


# ── Continuum ─────────────────────────────────────────────────
set -g @continuum-save-interval '15'
set -g @continuum-restore 'off'


# ── TPM ───────────────────────────────────────────────────────
run '~/.config/tmux/plugins/tpm/tpm'


# ── Resurrect ─────────────────────────────────────────────────
unbind C-s
bind C-s run-shell \
    "~/.config/tmux/plugins/tmux-resurrect/scripts/save.sh"


unbind C-r
bind C-r run-shell \
    "~/.config/tmux/plugins/tmux-resurrect/scripts/restore.sh"


# ── Theme — Kanagawa Wave ─────────────────────────────────────
bg="#1f1f28"
fg="#dcd7ba"
fg_dim="#727169"
fg_muted="#54546d"
accent="#7e9cd8"
border="#363646"


# ── Pane Appearance ────────────────────────────────────────────
set -g window-style "bg=${bg}"
set -g window-active-style "bg=${bg}"

set -g pane-border-style "fg=${border},bg=${bg}"
set -g pane-active-border-style "fg=${accent},bg=${bg}"


# ── Status Bar ────────────────────────────────────────────────
set -g status 2
set -g status-position top
set -g message-line 1
set -g status-justify left

set -g status-style "bg=${bg},fg=${fg}"

set -g status-left-length 50
set -g status-right-length 100

# Keep second line empty until tmux needs it
set -g status-format[1] ""


# ── Session ────────────────────────────────────────────────────
set -g status-left \
    "#[fg=${fg},bold] #S #[fg=${border}]│"


# ── Windows ────────────────────────────────────────────────────
set -g window-status-format \
    "#[fg=${fg_muted}]  #I  "

set -g window-status-current-format \
    "#[fg=${accent},bold]  #I  "

set -g window-status-last-style \
    "fg=${fg_dim},bg=${bg}"


# ── Right ──────────────────────────────────────────────────────
set -g status-right \
    "#[fg=${fg_dim}]%H:%M "


# ── Messages ──────────────────────────────────────────────────
set -g message-style "bg=${bg},fg=${fg}"
set -g message-command-style "bg=${bg},fg=${fg}"
